<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Point A to B.C.</title>
<meta name="description" content="Dad's shortcut sends a father and son tumbling through history. A point-and-click adventure you can play in your browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="From Point A to B.C.">
<meta property="og:description" content="Dad's shortcut sends a father and son tumbling through history. A point-and-click adventure you can play in your browser.">
<meta name="theme-color" content="#140b2b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23140b2b'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%235ef2ff' stroke-width='3' stroke-dasharray='9 5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ff5ec8' stroke-width='3' stroke-dasharray='5 4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23fff'/%3E%3C/svg%3E">
<style>
  :root {
    --letterbox: #07040d;
    --gold-hi: #fff6c8;
    --gold: #ffd36b;
    --gold-lo: #e08a2c;
    --ink: #2a0f05;
    --son: #7fe3ff;
    --dad: #ffd34d;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }

  body {
    background: var(--letterbox);
    display: grid;
    place-items: center;
    overflow: hidden;
    color: #fff;
    font-family: "Trebuchet MS", "Segoe UI", Verdana, sans-serif;
  }

  /* The stage keeps the classic 320x200 (16:10) adventure-game frame and scales to fit. */
  .stage {
    position: relative;
    width: min(100vw, 160vh);
    width: min(100vw, 160dvh);
    aspect-ratio: 16 / 10;
    container-type: inline-size;
    overflow: hidden;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .scene { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }

  /* ---------- Title ---------- */
  .title {
    position: absolute;
    top: 5%;
    left: 0;
    right: 0;
    text-align: center;
    pointer-events: none;
  }

  h1 {
    margin: 0;
    font-family: Georgia, "Times New Roman", Times, serif;
    font-weight: 700;
    font-size: 7.4cqw;
    line-height: 1.1;
    white-space: nowrap;
    color: transparent;
    background: linear-gradient(180deg, var(--gold-hi) 0%, var(--gold) 46%, var(--gold-lo) 54%, #ffe39a 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-stroke: 0.22cqw var(--ink);
    filter: drop-shadow(0 0.35cqw 0 var(--ink)) drop-shadow(0 0 1.4cqw rgba(0, 0, 0, 0.55));
  }

  /* "B.C." looks chiselled in stone. */
  h1 .bc {
    display: inline-block;
    margin-left: 0.08em;
    transform: rotate(-4deg) translateY(0.03em);
    background: linear-gradient(180deg, #f6f2e8 0%, #cbc3b2 47%, #8b8273 53%, #ddd6c7 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-stroke-color: #211c17;
  }

  .kicker {
    margin: 1.1cqw 0 0;
    padding-left: 0.42em;
    font-size: max(1.9cqw, 9px);
    letter-spacing: 0.42em;
    text-transform: uppercase;
    color: #ffe7c2;
    text-shadow: 0 0.2cqw 0 rgba(0, 0, 0, 0.65);
  }

  /* ---------- Dialogue (LucasArts-style coloured lines) ---------- */
  .dialogue {
    position: absolute;
    left: 4%;
    right: 4%;
    top: 64.5%;
    text-align: center;
    pointer-events: none;
  }

  .line {
    margin: 0;
    font-size: max(2.9cqw, 12px);
    font-weight: 700;
    line-height: 1.2;
    opacity: 0;
    text-shadow:
      0.18cqw 0 0 #000, -0.18cqw 0 0 #000, 0 0.18cqw 0 #000, 0 -0.18cqw 0 #000,
      0.18cqw 0.18cqw 0 #000, -0.18cqw 0.18cqw 0 #000, 0.18cqw -0.18cqw 0 #000, -0.18cqw -0.18cqw 0 #000;
  }
  .line.son { color: var(--son); }
  .line.dad { color: var(--dad); }
  .line.show { animation: line-in 0.28s ease-out forwards; }

  @keyframes line-in {
    from { opacity: 0; transform: translateY(0.6cqw); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Footer bits ---------- */
  .status {
    position: absolute;
    left: 0;
    right: 0;
    bottom: 4.6%;
    margin: 0;
    text-align: center;
    font-size: max(1.7cqw, 10px);
    color: #fff3dc;
    text-shadow: 0 0.18cqw 0 #000;
    pointer-events: none;
  }
  .status .soon {
    letter-spacing: 0.32em;
    text-transform: uppercase;
    animation: blink 1.4s steps(1) infinite;
  }
  .status .hint { opacity: 0.7; letter-spacing: 0.06em; }

  .copyright {
    position: absolute;
    right: 1.6%;
    bottom: 1.4%;
    margin: 0;
    font-size: max(1.15cqw, 8px);
    color: rgba(255, 255, 255, 0.45);
    pointer-events: none;
  }

  /* Phones held upright: the frame is letterboxed, so move the small print into the space below it. */
  @media (orientation: portrait) {
    .stage { overflow: visible; }
    .status { bottom: auto; top: calc(100% + 18px); font-size: 13px; }
    .copyright { left: 0; right: 0; bottom: auto; top: calc(100% + 46px); text-align: center; font-size: 11px; }
  }

  /* ---------- Scene animation ---------- */
  .ring { transform-box: fill-box; transform-origin: center; }
  .r1 { animation: spin 10s linear infinite; }
  .r2 { animation: spin 7s linear infinite reverse; }
  .r3 { animation: spin 4.5s linear infinite; }
  .r4 { animation: spin 2.6s linear infinite reverse; }

  .glow { transform-box: fill-box; transform-origin: center; animation: pulse 3.2s ease-in-out infinite; }

  .tw { animation: twinkle 2.8s steps(1) infinite; }
  .tw.d1 { animation-delay: -0.9s; }
  .tw.d2 { animation-delay: -1.7s; animation-duration: 3.6s; }

  .car-body { animation: bounce 0.5s steps(1) infinite; }

  .puff {
    transform-box: fill-box;
    transform-origin: center;
    opacity: 0;
    animation: puff 2s ease-out infinite;
  }
  .puff.p2 { animation-delay: -1s; }

  @keyframes spin    { to { transform: rotate(360deg); } }
  @keyframes pulse   { 50% { transform: scale(1.08); opacity: 0.8; } }
  @keyframes twinkle { 50% { opacity: 0.2; } }
  @keyframes bounce  { 50% { transform: translateY(-1px); } }
  @keyframes blink   { 50% { opacity: 0.35; } }
  @keyframes puff {
    0%   { opacity: 0; transform: translate(0, 0) scale(0.6); }
    15%  { opacity: 0.75; }
    100% { opacity: 0; transform: translate(-10px, -6px) scale(2); }
  }

  @media (prefers-reduced-motion: reduce) {
    .ring, .glow, .tw, .car-body, .puff, .status .soon { animation: none !important; }
    .puff { opacity: 0; }
    .line.show { animation: none; opacity: 1; }
  }
</style>
</head>
<body>
<main class="stage" id="stage">

  <header class="title">
    <h1>From Point A to <span class="bc">B.C.</span></h1>

  <div class="dialogue">
    <p class="line son show" id="line">Are we when yet?</p>

  <p class="status"><span class="soon">Coming soon</span> &middot; <span class="hint">click for more dad wisdom</span></p>
  <p class="copyright">&copy; 2026 n0tk3r. All rights reserved.</p>
</main>

<script>
  // Front-seat banter: the son asks, Dad answers. Click, tap or press a key to skip ahead.
  const exchanges = [
    ["Are we when yet?", "No, but we're making good time."],
    ["Dad, the map says this road ends.", "Maps don't know about shortcuts."],
    ["Why is the sky swirling?", "Weather. Probably."],
    ["Should we ask for directions?", "In what language?"],
    ["How long is this shortcut?", "About four thousand years, give or take."],
    ["Mom said to be home by dinner.", "She didn't say which century."]
  ];

  const line = document.getElementById("line");
  const stage = document.getElementById("stage");
  let index = 0;
  let timer;

  function say(text, speaker) {
    line.textContent = text;
    line.className = "line " + speaker;
    void line.offsetWidth; // restart the fade-in animation
    line.classList.add("show");
  }

  function play() {
    clearTimeout(timer);
    const [son, dad] = exchanges[index];
    say(son, "son");
    timer = setTimeout(() => {
      say(dad, "dad");
      timer = setTimeout(next, 3600);
    }, 2400);
  }

  function next() {
    index = (index + 1) % exchanges.length;
    play();
  }

  stage.addEventListener("click", next);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Enter" || event.key === " " || event.key === "ArrowRight") {
      event.preventDefault();
      next();
    }
  });

  play();
</script>
</body>
</html>
