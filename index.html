<!-- The stage is one picture, 800 pixels wide and 600 high (4:3), scaled to fit the window.
     Every position in the game is a pixel on that picture (js/engine/grid.js).
     Each layer below has one job. Order here is back to front. -->
<main class="stage" id="stage" data-era="present">
  <div class="layer" id="scene">                        <!-- the backdrop, and over it the light that stays smooth: wormholes, beams, glows -->
    <canvas class="backdrop" width="800" height="600"></canvas>     <!-- a backdrop that is drawn by code. A painted one is shown as a picture, which the engine puts in here (js/engine/scene.js). -->
    <svg class="live" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" shape-rendering="crispEdges" role="img"></svg>
  </div>
  <canvas class="layer cast" id="cast" width="800" height="600"></canvas>   <!-- people, painted cut-outs and props, sorted by depth -->
  <canvas class="layer" id="fx" width="800" height="600"></canvas>  <!-- particle effects: the time tunnel -->
  <svg class="layer hot" id="hot" viewBox="0 0 800 600" preserveAspectRatio="none" aria-label="Scene"></svg>  <!-- clickable areas -->
  <svg class="layer" id="closeup" viewBox="0 0 800 600" preserveAspectRatio="none" role="img" hidden></svg>   <!-- a close look at a screen, a notice, a note -->
  <header class="layer" id="title" hidden>
    <div class="strip"><div class="papyrus"><h1>From Point A to B.C.</h1></div></div>
    <p class="kicker">A point-and-click adventure</p>
  </header>
  <div class="layer" id="dialogue" aria-live="polite"></div>
  <div class="layer" id="hud" hidden></div>
  <div class="layer" id="fade"></div>                   <!-- fades and flashes -->
  <div class="layer" id="card"></div>                   <!-- era and chapter cards, readable over a fade -->
  <div class="layer" id="menu" hidden></div>
  <button id="skip" type="button" hidden>Skip <span aria-hidden="true">&raquo;</span></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="layer" id="gate">

<script>
  // Starting up. These three jobs are done here, in the page, and not in the game's own files,
  // because they are about whether those files arrive whole:
  //   1. if the page was opened straight from a folder, say how to run it;
  //   2. if the server has a newer copy of this page than the one the browser kept, load that one,
  //      so nobody plays a version that is ten minutes out of date;
  //   3. if the game cannot start, say so in words. Never a blank screen.
  (function () {
    var begin = document.getElementById("begin"), note = document.getElementById("gate-note"), failed = false;
    function words(text) { var p = document.createElement("span"); p.textContent = text; return p.innerHTML; }

    if (location.protocol === "file:") {             // the game is split into module files, and browsers only load those from a web address
      begin.hidden = true;
      note.innerHTML = "This page was opened straight from a folder, so the game cannot load.<br>" +
        "In the game folder run <code>python3 tools/serve.py</code> and open <code>http://localhost:8000</code>.";
      return;
    }

    function trouble(why) {
      if (failed || !begin.disabled) return;         // (the game enables the button once it is ready: after that, mishaps are its own to handle)
      failed = true;
      note.innerHTML = "The game could not start. Press Reload.<br>If that does not help, hold Shift while you reload the page." +
        (why ? "<br><code>" + words(String(why).slice(0, 160)) + "</code>" : "");
      begin.textContent = "Reload";
      begin.disabled = false;
      begin.onclick = function () { location.reload(); };
    }
    window.addEventListener("error", function (event) { trouble(event.message || "A file would not load."); });
    window.addEventListener("unhandledrejection", function (event) { trouble(event.reason && event.reason.message || event.reason); });
    setTimeout(function () { trouble("It took too long."); }, 25000);

    function start() {
      var src = "js/main.js";
      try { src = JSON.parse(document.querySelector('script[type="importmap"]').textContent).imports["./js/main.js"] || src; } catch (e) { /* not stamped: plain addresses still work */ }
      var script = document.createElement("script");
      script.type = "module";
      script.src = src;
      script.onerror = function () { trouble("A file would not load."); };
      document.body.appendChild(script);
    }

    // The check costs one small request, and is only needed when the browser showed a page it had kept.
    // A page that has just come from the server is the newest there is.
    var mine = document.documentElement.getAttribute("data-build"), arrived = null;
    try { arrived = performance.getEntriesByType("navigation")[0]; } catch (e) { /* older browsers: check anyway */ }
    if (!mine || !window.fetch || !window.AbortController || (arrived && arrived.transferSize > 0)) return start();
    var stop = new AbortController(), timer = setTimeout(function () { stop.abort(); }, 2500);
    fetch(location.href.split("#")[0], { cache: "no-store", signal: stop.signal })
      .then(function (reply) { return reply.ok ? reply.text() : ""; })
      .then(function (page) {
        clearTimeout(timer);
        var found = /<html\b[^>]*\bdata-build="([^"]*)"/.exec(page), theirs = found && found[1];
        if (theirs && theirs !== mine) {             // the browser kept an older page: fetch the new one, once
          var tried;
          try { tried = sessionStorage.getItem("pabc.build"); sessionStorage.setItem("pabc.build", theirs); } catch (e) { tried = theirs; }
          if (tried !== theirs) return location.reload();
        }
        start();
      })
      .catch(function () { clearTimeout(timer); start(); });      // offline, or slow: carry on with what we have
  })();
</script>
