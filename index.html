<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Point A to B.C.</title>
<meta name="description" content="Dad's shortcut sends a father and son tumbling through history. A point-and-click adventure you can play in your browser.">
<meta property="og:type" content="website">
<meta property="og:title" content="From Point A to B.C.">
<meta property="og:description" content="Dad's shortcut sends a father and son tumbling through history. A point-and-click adventure you can play in your browser.">
<meta name="theme-color" content="#140b2b">
<meta name="color-scheme" content="dark">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23140b2b'/%3E%3Ccircle cx='16' cy='16' r='11' fill='none' stroke='%235ef2ff' stroke-width='3' stroke-dasharray='9 5'/%3E%3Ccircle cx='16' cy='16' r='6' fill='none' stroke='%23ff5ec8' stroke-width='3' stroke-dasharray='5 4'/%3E%3Ccircle cx='16' cy='16' r='2' fill='%23fff'/%3E%3C/svg%3E">
<link rel="stylesheet" href="css/tokens.css">
<link rel="stylesheet" href="css/game.css">
</head>
<body>
<!-- The stage is a 320x200 grid (16:10) that scales to fit the window.
     Each layer below has one job. Order here is back to front. -->
<main class="stage" id="stage" data-era="present">
  <div class="layer" id="scene"></div>                  <!-- the background drawing (SVG) -->
  <div class="layer" id="actors"></div>                 <!-- people and vehicles that move -->
  <canvas class="layer" id="fx" width="640" height="400"></canvas>  <!-- particle effects: the time tunnel -->
  <svg class="layer" id="hot" viewBox="0 0 320 200" preserveAspectRatio="none" aria-label="Scene"></svg>  <!-- clickable areas -->
  <header class="layer" id="title" hidden>
    <div class="strip"><div class="papyrus"><h1>From Point A to B.C.</h1></div></div>
    <p class="kicker">A point-and-click adventure</p>
  </header>
  <div class="layer" id="dialogue" aria-live="polite"></div>
  <div class="layer" id="hud" hidden></div>
  <div class="layer" id="fade"></div>                   <!-- fades and flashes -->
  <div class="layer" id="card"></div>                   <!-- era and chapter cards, readable over a fade -->
  <div class="layer" id="menu" hidden></div>
  <button id="skip" type="button" hidden>Skip <span aria-hidden="true">&raquo;</span></button>
  <div id="toast" role="status" aria-live="polite"></div>
  <div class="layer" id="gate">
    <svg viewBox="0 0 64 64" width="64" height="64" aria-hidden="true">
      <circle class="ring r1 t-cyan" cx="32" cy="32" r="26" fill="none" stroke-width="3" stroke-dasharray="12 7"/>
      <circle class="ring r2 t-magenta" cx="32" cy="32" r="19" fill="none" stroke-width="3" stroke-dasharray="8 6"/>
      <circle class="ring r3 t-violet" cx="32" cy="32" r="12" fill="none" stroke-width="2.5" stroke-dasharray="6 5"/>
      <circle class="t-core" cx="32" cy="32" r="4"/>
    </svg>
    <button id="begin" type="button" class="chip" disabled>Loading&hellip;</button>
    <p id="gate-note">Best with sound on.</p>
  </div>
</main>
<p class="copyright">&copy; 2026 n0tk3r. All rights reserved.</p>

<noscript><p class="notice">This game needs JavaScript turned on.</p></noscript>
<script>
  // The game is split into module files, and browsers only load those from a web address.
  if (location.protocol === "file:") {
    document.getElementById("begin").hidden = true;
    document.getElementById("gate-note").innerHTML =
      "This page was opened straight from a folder, so the game cannot load.<br>" +
      "In the game folder run <code>python3 -m http.server</code> and open <code>http://localhost:8000</code>.";
  }
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
